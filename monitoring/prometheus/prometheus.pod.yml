# Pod variant: everything runs as a plain process on the same host, bound to loopback.
global:
  scrape_interval: 5s
  evaluation_interval: 30s

scrape_configs:
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8000"]
  - job_name: vllm-embedding
    static_configs:
      - targets: ["127.0.0.1:8001"]
  - job_name: gpu
    static_configs:
      - targets: ["127.0.0.1:9400"]
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
