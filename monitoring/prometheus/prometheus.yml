# Reference stack (docker compose): targets are compose service names.
global:
  scrape_interval: 5s
  evaluation_interval: 30s

scrape_configs:
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["vllm:8000"]
  - job_name: vllm-embedding
    static_configs:
      - targets: ["vllm-embedding:8001"]
  - job_name: gpu
    static_configs:
      - targets: ["dcgm-exporter:9400"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
