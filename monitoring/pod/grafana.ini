; Grafana on a workshop pod. Loopback only; participants reach it with `ssh -L 3000:127.0.0.1:3000`.
[server]
http_addr = 127.0.0.1
http_port = 3000

[auth.anonymous]
enabled = true
org_role = Viewer

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[security]
disable_gravatar = true
