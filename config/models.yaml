# The models this workshop runs. Everything that downloads weights reads this file.
#
# The open-model ecosystem moves fast. Before each delivery:
#   1. re-check that each model is still the right smallest-model-that-works for its role,
#   2. re-pin `revision` to the commit you validated (Hugging Face commit SHA, never `main`),
#   3. re-run the baseline experiment (experiments/baseline) and update docs/MODEL-SELECTION.md.
# `pnpm check` rejects a revision that is not a full 40-character SHA.
#
# `architecture` carries the fields needed to size memory by hand (scripts/sizing.py):
#   KV cache bytes per token = 2 (K and V) x layers x kv_heads x head_dim x bytes per element.
# Values are copied from each model's config.json at the pinned revision.
# `weights_gb` is the sum of the *.safetensors files at that revision (10^9 bytes).

models:
  primary:
    repo: Qwen/Qwen3-8B
    revision: b968826d9c46dd6066d109eabc6255188de91218
    publisher: "Alibaba Cloud (Qwen team)"
    role: "Primary model for the whole path (dense, grouped-query attention, tool calling, thinking mode)"
    license: Apache-2.0
    license_url: https://huggingface.co/Qwen/Qwen3-8B/blob/main/LICENSE
    commercial_use: "Permitted under Apache-2.0 (attribution and licence notice required; no patent retaliation clause beyond Apache terms)"
    source: https://huggingface.co/Qwen/Qwen3-8B
    precision: bf16
    weights_gb: 16.38
    context_native: 40960
    workshop: true
    architecture:
      type: dense
      parameters_b: 8.2
      layers: 36
      hidden_size: 4096
      attention_heads: 32
      kv_heads: 8
      head_dim: 128

