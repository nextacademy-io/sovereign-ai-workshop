    commercial_use: "Permitted under Apache-2.0"
    source: https://huggingface.co/Qwen/Qwen3-8B-FP8
    precision: fp8
    weights_gb: 9.44 # not half of 16.38: embeddings and the output head stay in BF16
    context_native: 40960
    workshop: true
    architecture:
