# Alternatives discussed in the model-selection lab. They are NOT downloaded and carry no
# pinned revision here; check their current licence text before recommending them.
alternatives_discussed:
  - family: Qwen3.5
    note: "Newer Qwen generation (hybrid attention). Verify the vLLM version and tool-call parser before using."
  - family: Gemma
    note: "Check the current licence terms and size options on the model card."
  - family: Mistral
    note: "Mistral Small and Ministral releases; licence differs between releases (Apache-2.0 vs research licences)."
  - family: Llama
    note: "Llama community licence with usage conditions; not Apache-2.0."
  - family: DeepSeek
    note: "Large mixture-of-experts models; does not fit a single 96 GB GPU in full precision."
  - family: Kimi
    note: "Very large mixture-of-experts models; modified licence conditions apply at scale."
  - family: gpt-oss
    note: "OpenAI open-weight models (Apache-2.0), 20B and 120B, MXFP4 weights."
