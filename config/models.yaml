    license: Apache-2.0
    license_url: https://huggingface.co/Qwen/Qwen3-1.7B/blob/main/LICENSE
    commercial_use: "Permitted under Apache-2.0"
    source: https://huggingface.co/Qwen/Qwen3-1.7B
