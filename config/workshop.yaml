# Single source of truth for the workshop's module path.
#
# The material is one ordered path of modules (about three days of content), without days, clock
# times or durations: the trainer paces it freely. `pnpm check` validates this file: ids are unique,
# every module has a slide section and a divider that agrees with it, every lab names a task file,
# and every learning outcome (1-23, see docs/CURRICULUM.md) is covered by at least one module.
#
# Module kinds: lecture | demo | lab | discussion | mixed
# Layers (the mental model used on every slide):
#   runtime | infrastructure | application | all
# `skippable: true` marks content a trainer may drop when the group needs the room elsewhere;
# `keep_slides` names the slides at the end of a skippable module that stay.

workshop:
  title: "KI ohne Cloud"
  subtitle: "Running and Operating Open Models on Your Own Infrastructure"
  author: "Paweł Sawicki"
  trainer_profile: "https://www.nextacademy.io/de/trainers/pawel-sawicki"
  scope: "material for about three days, paced freely"
  max_participants: 15
  format: remote, instructor-led, hands-on
  gpu_class: "NVIDIA RTX PRO 6000 Blackwell Server Edition (96 GB)"
  groups:
    - { id: alpha, host: gpu-01 }
    - { id: beta, host: gpu-02 }
    - { id: gamma, host: gpu-03 }
    - { id: delta, host: gpu-04 }

# Work participants do before the first module.
prework:
  - id: pre-00-preflight
    title: Preflight checks on the participant laptop
    task: 00-preflight
    outcomes: [9]

modules:
  - id: 01-opening
    title: "Opening: why run models yourself"
    kind: lecture
    layer: all
    outcomes: [2, 20]

  - id: 02-models
    title: "Modern language models"
    kind: lecture
    layer: runtime
    outcomes: [1, 2]

  - id: 03-gpu-fundamentals
    title: "GPU fundamentals for inference"
    kind: lecture
    layer: runtime
    outcomes: [7]

  - id: 04-gpu-sizing
    title: "GPU sizing: weights, KV cache, overhead"
    kind: mixed
    layer: runtime
    outcomes: [4, 5]
    experiments: [baseline]

  - id: 05-inference-mechanics
    title: "Inference mechanics: prefill, decode, latency"
    kind: mixed
    layer: runtime
    outcomes: [1, 6, 7]

  - id: 06-model-selection
    title: "Model selection"
    kind: mixed
    layer: runtime
    outcomes: [3]

  - id: 07-lab-model-selection
    title: "Lab 1: select models for four scenarios"
    kind: lab
    layer: runtime
    task: 01-model-selection
    outcomes: [3, 18]

  - id: 08-first-vllm
    title: "First vLLM deployment (trainer demo)"
    kind: demo
    layer: runtime
    outcomes: [8, 9]

  - id: 09-lab-first-server
    title: "Lab 2: first inference server"
    kind: lab
    layer: runtime
    task: 02-first-inference-server
    outcomes: [8, 9, 11]

  - id: 10-checkpoint
    title: "Checkpoint: bottleneck predictions"
    kind: discussion
    layer: all
    outcomes: [1, 7]

  - id: 11-measuring
    title: "Measuring inference"
    kind: mixed
    layer: runtime
    outcomes: [6, 11]

  - id: 12-lab-benchmark
    title: "Lab 3: benchmark the baseline"
    kind: lab
    layer: runtime
    task: 03-benchmark
    outcomes: [10, 11, 14, 18]
    experiments: [baseline, concurrency]

  - id: 13-continuous-batching
    title: "Continuous batching"
    kind: mixed
    layer: runtime
    outcomes: [12, 14]
    experiments: [concurrency]

  - id: 14-kv-cache
    title: "KV cache, PagedAttention and prefix caching"
    kind: mixed
    layer: runtime
    outcomes: [5, 13, 14]
    experiments: [context-length, prefix-cache]

  - id: 15-quantization
    title: "Quantization"
    kind: mixed
    layer: runtime
    outcomes: [14, 18]
    experiments: [quantization]

  - id: 16-parallelism
    title: "Parallelism: replicas, tensor, pipeline, expert"
    kind: mixed
    layer: runtime
    outcomes: [14, 17]
    experiments: [tensor-parallel]

  - id: 17-lab-optimize
    title: "Lab 4: optimize the deployment"
    kind: lab
    layer: runtime
    task: 04-optimization
    outcomes: [14, 18]
    experiments: [quantization, prefix-cache, context-length, concurrency]

  - id: 18-demos
    title: "Trainer demos: speculative decoding and OOM"
    kind: demo
    layer: runtime
    outcomes: [14]
    experiments: [tensor-parallel, demos]
    skippable: true
    # Skip the demos, not the last three slides: predictions scored, five sentences, bridge to production.
    keep_slides: 3

  - id: 19-production-architecture
    title: "Production architecture"
    kind: lecture
    layer: infrastructure
    outcomes: [17, 23]

  - id: 20-containerization
    title: "Containerization and reproducible deployments"
    kind: mixed
    layer: infrastructure
    outcomes: [15]

  - id: 21-observability
    title: "Observability: metrics, dashboards, incident investigation"
    kind: mixed
    layer: infrastructure
    outcomes: [11, 16]

  - id: 22-scaling
    title: "Scaling strategies"
    kind: lecture
    layer: infrastructure
    outcomes: [17, 18]

  - id: 23-security-sovereignty
    title: "Security, compliance and digital sovereignty"
    kind: mixed
    layer: infrastructure
    outcomes: [19, 20]

  - id: 24-rag
    title: "RAG without framework hype"
    kind: mixed
    layer: application
    outcomes: [21, 22]

  - id: 25-tools-agents
    title: "Tool calling, MCP and agents"
    kind: mixed
    layer: application
    outcomes: [21, 22]

  - id: 26-lab-architecture
    title: "Lab 5: production architecture challenge"
    kind: lab
    layer: all
    task: 05-production-design
    outcomes: [18, 23]

  - id: 27-capstone-close
    title: "Architecture defenses, decision framework, close"
    kind: discussion
    layer: all
    outcomes: [18, 23]
