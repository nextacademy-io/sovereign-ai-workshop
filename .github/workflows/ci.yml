name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly external link check (Mondays 06:00 UTC). Model pages and vendor docs move.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.12"

jobs:
  repo-checks:
    name: Repo consistency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tasks, timeboxes, speaker notes, metric sources, YAML configs
        run: pnpm check:release

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:md

  slides:
    name: Slidev build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Render every slide in a browser and fail on content outside the slide area
        run: |
          pnpm --filter slides exec playwright install --with-deps chromium
          node scripts/check-slides-layout.mjs
      - name: PDF export (the handout and the offline fallback)
        run: pnpm export

  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv run --extra dev ruff check .
      - run: uv run --extra dev ruff format --check .
      - run: uv run --extra dev pytest
      - name: Workshop states are generated from the reference results
        run: uv run --extra dev python scripts/build_workshop_states.py --check

  shell:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: bash scripts/lint-shell.sh

  pod-tooling:
    name: Pod tooling in a clean container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: wsctl, accounts, rollback, stray servers (fake vllm, no GPU)
        run: infra/tests/wsctl-integration.sh

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - run: gitleaks git --config .gitleaks.toml --redact --verbose

  links:
    name: Link check (lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline on PRs and pushes, online on the weekly schedule
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            ${{ github.event_name == 'schedule' && '' || '--offline' }}
            --no-progress
            './**/*.md'
          fail: true
