[project]
name = "ki-ohne-cloud-tools"
version = "0.1.0"
description = "Benchmark harness and workshop tooling for the KI ohne Cloud inference engineering workshop."
requires-python = ">=3.11"
license = { text = "All rights reserved" }
authors = [{ name = "Paweł Sawicki" }]
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
apps = [
  "openai>=1.50",
  "numpy>=1.26",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "openai>=1.50",
  "numpy>=1.26",
]

[tool.pytest.ini_options]
testpaths = ["benchmark/tests", "apps", "infra/tests", "monitoring", "scripts", "experiments"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["node_modules", "slides"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length is enforced by `ruff format`
