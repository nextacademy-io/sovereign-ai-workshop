[project]
name = "ki-ohne-cloud-tools"
version = "0.1.0"
description = "Benchmark harness and workshop tooling for the KI ohne Cloud inference engineering workshop."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Paweł Sawicki" }]
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["benchmark/tests", "apps"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["node_modules", "slides"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
